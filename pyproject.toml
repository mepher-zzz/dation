[project]
name = "ai-gemini-test"
version = "0.1.0"
description = "Análisis visual de obras y fichas públicas de seguimiento"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "gradio>=6.28.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.18.0",
    "ruff>=0.13.0",
]

[project.scripts]
ai-gemini-test = "ai_gemini_test:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
